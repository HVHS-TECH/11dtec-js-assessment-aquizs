<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
<title>cool factory</title>
</head>
<body>

<div class="container">

    <header><h1>cool factory</h1></header>

        <div id="products">

            <div class="cards">
                <img src="images/vantageshirt.png" alt="vantage shirt product">
                <h3>Vantage Shirt</h3>
                <p>$40</p>
                <button onclick="addToCart('Vantage Shirt',40)">Add</button>
            </div>

            <div class="cards">
                <img src="images/moon.jpg" alt="moon product">
                <h3>Moon</h3>
                <p>999,999,999,999</p>
                <button onclick="addToCart('Moon',999999)">Add</button>
            </div>

            <div class="cards">
                <img src="images/apache.jpg" alt="apache helicopter">
                <h3>Apache Helicopter</h3>
                <p>$25,000,000</p>
                <button onclick="addToCart('Apache Helicopter',25000000)">Add</button>
            </div>

            <div class="cards">
                <img src="images/rocket.jpg" alt="rocket">
                <h3>Rocket</h3>
                <p>$500,000,000</p>
                <button onclick="addToCart('Rocket',500000000)">Add</button>
            </div>

            <div class="cards">
                <img src="images/chatgptlogo.png" alt="chatgpt company">
                <h3>Chatgpt</h3>
                <p>$852,000,000,000</p>
                <button onclick="addToCart('Chatgpt',852000000000)">Add</button>
            </div>

            <div class="cards">
                <img src="images/tungtung.png" alt="tungtungsahur collectible">
                <h3>Tung Tung Tung Sahur</h3>
                <p>$25</p>
                <button onclick="addToCart('Tung Tung Tung Sahur',25)">Add</button>
            </div>
        </div>

        <div id="cart">
            <h2>Cart</h2>

            <div id="cartItems"> Cart is empty</div>
            <h3>Total: $<span id="total">0</span></h3>

            <form onsubmit="return false;">
                <label>Name:</label>
                <input type="text" id="nameField" placeholder="Name">

                <label>Money:</label>
                <input type="number" id="moneyField" min="0" placeholder="Money">

                <button onclick="checkOut()">Checkout</button>
                <button onclick="resetOrder()">Reset Order</button>
            </form>

            <div id="receipt"></div>

        </div>
</div>


<script src="script.js"></script>
</body>
</html>
