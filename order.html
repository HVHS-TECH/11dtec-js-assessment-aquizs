<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
<title>cool factory</title>
</head>
<body>

<div class="container">


        <div id="products">
            <h2>products</h2>

            <div class="cards">
                <h3>Vantage Shirt</h3>
                <p>$40</p>
                <button onclick="addToCart('Vantage Shirt',40)">Add</button>
            </div>

            <div class="cards">
                <h3>Moon</h3>
                <p>$999,999</p>
                <button onclick="addToCart('Moon',999999)">Add</button>
            </div>

            <div class="cards">
                <h3>Apache Helicopter</h3>
                <p>$25,000,000</p>
                <button onclick="addToCart('Apache Helicopter',25000000)">Add</button>
            </div>
        </div>

            <div class="cards">
                <h3>Rocket</h3>
                <p>$500,000,000</p>
                <button onclick="addToCart('Rocket',500000000)">Add</button>
            </div>
</div>

        <div id="cart">
            <h2>Cart</h2>

            <div id="cartItems"> Cart is empty</div>
            <h3>Total: $<span id="total">0</span></h3>

            <form onsubmit="return false;">
                <label>Name:</label>
                <input type="text" id="nameField" placeholder="Name">

                <label>Money:</label>
                <input type="number" id="moneyField" placeholder="Money">
            </form>
        </div>



<div id="JavaScriptOutput"></div>


<script src="script.js"></script>
</body>
</html>
